[project]
name = "control-panel"
version = "0.1.0"
description = "AI-native control plane for Windows ARM64 PCs"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "typer>=0.15",
    "rich>=14.0",
    "psutil>=7.0",
    "aiosqlite>=0.21",
    "structlog>=25.0",
    "httpx>=0.28",
    "onnxruntime",
    "tomli>=2.0; python_version < '3.11'",
    "onnxruntime-genai>=0.16.0",
    "onnxruntime-qnn>=2.6.0",
    "huggingface-hub>=1.32.0",
    "qai-hub>=0.55.0",
]

[project.optional-dependencies]
snapdragon = [
    "onnxruntime-qnn",
]
genai = [
    "onnxruntime-genai",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "onnx>=1.15",
]

[project.scripts]
control-panel = "control_panel.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_panel"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
